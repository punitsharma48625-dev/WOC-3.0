<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111419">
  <meta name="description" content="WOC 3.0 simulation archive — searchable cricket player and match statistics.">
  <title>WOC 3.0 · Simulation Stats</title>
  <link rel="stylesheet" href="./assets/site.css?v=20261024-night-3">
  <script src="./assets/site.js?v=20261024-night-3" defer></script>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="brand-lockup">
        <svg class="brand-mark" viewBox="0 0 56 56" aria-hidden="true">
          <circle cx="28" cy="28" r="25" fill="#20252c" stroke="#d6a75f" stroke-width="1.5"/>
          <path d="M17 39V20m6 19V16m6 23V16m6 23V20M15 39h22" fill="none" stroke="#f0e8d8" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="39" cy="18" r="5.2" fill="#df7658" stroke="#f1d8c2" stroke-width="1"/>
          <path d="M36 14.7c2.6 2.1 4 4.4 4.4 6.8" fill="none" stroke="#f7e4d3" stroke-width=".8"/>
        </svg>
        <div class="brand-copy"><div class="brand-kicker">WORLD OF CRICKET</div><div class="brand"><span>WOC</span><span class="brand-version">3.0</span><span class="brand-divider">/</span><span class="brand-description">SIMULATION ARCHIVE</span></div></div>
      </div>
      <svg class="hero-art" viewBox="0 0 300 110" aria-hidden="true">
        <path d="M10 55c18-33 64-48 140-48s122 15 140 48c-18 33-64 48-140 48S28 88 10 55Z" fill="none" stroke="#77818a" stroke-width="1.2"/>
        <path d="M25 55c18-22 55-33 125-33s107 11 125 33c-18 22-55 33-125 33S43 77 25 55Z" fill="none" stroke="#535d65" stroke-width="1" stroke-dasharray="3 5"/>
        <path d="M117 37h66v36h-66z" fill="#b78b53" opacity=".18" stroke="#d4aa6d" stroke-width="1.2"/>
        <path d="M145 38v34m9-34v34m9-34v34M140 39h28m-28 32h28" stroke="#e8d9bd" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="212" cy="39" r="6" fill="#df7658" stroke="#f3d9c4" stroke-width="1"/>
        <path d="M208 35c3 2 5 5 5 8" fill="none" stroke="#fff0df" stroke-width=".8"/>
        <path d="M39 54h5m212 0h5M150 8v5m0 84v5" stroke="#d6a75f" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
  </header>

  <main class="shell">
    <div class="toolbar">
      <label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search this table…" autocomplete="off"><kbd>⌘ K</kbd></label>
      <label class="filter-wrap"><span>FORMAT</span><select id="format-filter"><option value="">All formats</option></select></label>
      <details class="country-filter" id="country-filter">
        <summary><span class="filter-caption">COUNTRY</span><span id="country-summary">All countries</span><span aria-hidden="true">⌄</span></summary>
        <div class="country-menu">
          <input id="country-search" type="search" placeholder="Find a country…" autocomplete="off" aria-label="Find a country">
          <div class="country-options" id="country-options"></div>
        </div>
      </details>
      <label class="filter-wrap"><span>GENDER</span><select id="gender-filter"><option value="">All genders</option><option value="Male">Male</option><option value="Female">Female</option></select></label>
      <label class="filter-wrap"><span>CAREER STATUS</span><select id="status-filter"><option value="">All statuses</option><option value="Active">Active</option><option value="Retired">Retired</option><option value="Unknown">Unknown</option></select></label>
      <button id="clear-filters" class="clear-filters" type="button" title="Clear search, format and all column filters">Clear filters</button>
      <a id="download" class="download" href="#" download>↓ <span>Download CSV</span></a>
    </div>

    <nav id="tabs" class="tabs" aria-label="Stat categories"></nav>
    <section class="table-card" aria-live="polite">
      <div class="table-heading"><div id="table-label" class="table-title">Loading…</div><div class="table-counts"><div id="row-count" class="row-count"></div><div id="filter-count" class="filter-count"></div></div></div>
      <div class="table-scroll"><table id="stats-table"><thead></thead><tbody></tbody></table></div>
      <div class="empty hidden" id="empty">No rows match those filters.</div>
      <footer class="table-footer"><span id="page-label"></span><div class="pager"><button id="prev" type="button">← Previous</button><button id="next" type="button">Next →</button></div></footer>
    </section>
  </main>
</body>
</html>
